      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: formId
      value: 5aba8808-fd43-9a01-2a88-a31c002c4ac9
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "confirmation": {}
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "deleted": {
          "id": "44714433-c0a0-c69b-9b4a-e05de437cdfd"
        }
      }
order: 1000
