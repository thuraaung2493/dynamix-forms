$kind: http-example
request:
  url: "{{baseUrl}}/api/auth/me"
  method: GET
  headers:
    - key: dynamix_session
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "user": {
          "id": "1978ec82-de98-b976-0acc-b4c9fc5f6cf2",
          "email": "kVrpfXiiO7e@QpteNRRleTXJoAadTwSxuuYYAuLWSKnd.bvax",
          "displayName": "string"
        }
      }
order: 1000
