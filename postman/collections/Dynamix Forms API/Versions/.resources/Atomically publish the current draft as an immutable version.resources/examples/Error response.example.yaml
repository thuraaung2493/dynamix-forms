$kind: http-example
request:
  url: "{{baseUrl}}/api/forms/:formId/publish"
  method: POST
  headers:
    - key: dynamix_session
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: formId
      value: 5aba8808-fd43-9a01-2a88-a31c002c4ac9
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "expectedRevision": 180
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "string",
          "message": "string",
          "details": ""
        }
      }
order: 2000
